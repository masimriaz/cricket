<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Cup 2026 — Finance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#BF0A30;--blue:#002868;--blue-dark:#001a4a;--gold:#FFD700}
*{box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1e293b;margin:0;padding:1.5rem}
h1,h2,h3,h4,h5,h6{font-family:'Poppins',sans-serif}
.page-header{text-align:center;margin-bottom:2rem}
.page-header h1{font-size:1.6rem;font-weight:800;color:var(--blue)}
.page-header p{font-size:.8rem;color:#64748b}
.card{border:none;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);overflow:hidden}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-box{background:#fff;border-radius:12px;padding:1.2rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid transparent}
.stat-box .num{font-size:1.6rem;font-weight:800;font-family:'Poppins'}
.stat-box .label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-top:.2rem}
.section-title{font-size:.9rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.table{font-size:.82rem}
.table thead{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}
.table td,.table th{padding:.5rem .6rem;vertical-align:middle}
.add-row{background:#f0f9ff;border:1px dashed #93c5fd;cursor:pointer;transition:all .2s}
.add-row:hover{background:#dbeafe}
.chart-bar{height:20px;border-radius:4px;transition:width .5s}
.profit-badge{display:inline-block;padding:.3rem .8rem;border-radius:50px;font-weight:700;font-size:.85rem}
@media print{body{padding:0}.no-print{display:none!important}}
</style>
</head>
<body>
<div style="max-width:900px;margin:0 auto">

<div class="page-header">
<h1><i class="bi bi-wallet2 me-2"></i>Freedom Cup 2026 — Finance</h1>
<p>Budget Management • Auto-calculated • Saturday, July 4, 2026</p>
<div class="d-flex gap-2 justify-content-center no-print">
<a href="admin.html" class="btn btn-sm btn-outline-primary"><i class="bi bi-arrow-left me-1"></i>Admin</a>
<button class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
</div>
</div>

<!-- Summary Stats -->
<div class="stat-row" id="stats"></div>

<!-- Visual Bar Chart -->
<div class="card mb-4">
<div class="card-body">
<h5 class="section-title"><i class="bi bi-bar-chart-fill text-primary"></i>Budget Overview</h5>
<div id="chart"></div>
</div>
</div>

<!-- Revenue -->
<div class="row g-4 mb-4">
<div class="col-md-6">
<div class="card h-100">
<div class="card-body">
<h5 class="section-title" style="color:#16a34a"><i class="bi bi-arrow-down-circle-fill"></i>Budget (Entry Fees + Sponsors)</h5>
<table class="table table-sm table-hover mb-2">
<thead class="table-success"><tr><th>Source</th><th class="text-end">Amount</th><th class="text-center no-print">Action</th></tr></thead>
<tbody id="revenueBody"></tbody>
<tfoot><tr class="fw-bold table-light"><td>Total Budget</td><td class="text-end" id="totalRevenue">—</td><td class="no-print"></td></tr></tfoot>
</table>
<button class="btn btn-sm btn-outline-success w-100 no-print" onclick="addRow('revenue')"><i class="bi bi-plus-circle me-1"></i>Add Budget/Sponsor</button>
</div>
</div>
</div>

<!-- Expenses -->
<div class="col-md-6">
<div class="card h-100">
<div class="card-body">
<h5 class="section-title" style="color:#dc2626"><i class="bi bi-arrow-up-circle-fill"></i>Expenses</h5>
<table class="table table-sm table-hover mb-2">
<thead class="table-danger"><tr><th>Item</th><th class="text-end">Amount</th><th class="text-center no-print">Action</th></tr></thead>
<tbody id="expenseBody"></tbody>
<tfoot><tr class="fw-bold table-light"><td>Total Expenses</td><td class="text-end" id="totalExpense">—</td><td class="no-print"></td></tr></tfoot>
</table>
<button class="btn btn-sm btn-outline-danger w-100 no-print" onclick="addRow('expense')"><i class="bi bi-plus-circle me-1"></i>Add Expense</button>
</div>
</div>
</div>
</div>

<!-- Breakdown Pie -->
<div class="row g-4 mb-4">
<div class="col-md-6">
<div class="card">
<div class="card-body">
<h5 class="section-title"><i class="bi bi-pie-chart-fill text-warning"></i>Expense Breakdown</h5>
<div id="expensePie"></div>
</div>
</div>
</div>
<div class="col-md-6">
<div class="card">
<div class="card-body">
<h5 class="section-title"><i class="bi bi-pie-chart-fill text-success"></i>Budget Breakdown</h5>
<div id="revenuePie"></div>
</div>
</div>
</div>
</div>

</div>

<script>
// Data stored in localStorage for persistence
const STORAGE_KEY = 'freedomCupFinance';

const defaultData = {
  revenue: [
    {name: 'Team Entry Fees (10×$500)', amount: 5000},
    {name: 'Sponsor 1', amount: 250},
    {name: 'Sponsor 2', amount: 200},
    {name: 'Sponsor 3', amount: 500},
    {name: 'Sponsor 4', amount: 500},
    {name: 'Sponsor 5', amount: 100},
    {name: 'Sponsor 6', amount: 300},
  ],
  expenses: [
    {name: 'Ground Booking', amount: 150},
    {name: 'Trophies', amount: 600},
    {name: 'Tapes and Balls', amount: 200},
    {name: 'Tent', amount: 120},
  ]
};

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  return saved ? JSON.parse(saved) : defaultData;
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function render() {
  const data = loadData();
  const totalRev = data.revenue.reduce((s,r) => s + r.amount, 0);
  const totalExp = data.expenses.reduce((s,e) => s + e.amount, 0);
  const profit = totalRev - totalExp;

  // Stats
  document.getElementById('stats').innerHTML = `
    <div class="stat-box" style="border-left-color:#16a34a"><div class="num" style="color:#16a34a">$${totalRev.toLocaleString()}</div><div class="label">Total Budget</div></div>
    <div class="stat-box" style="border-left-color:#dc2626"><div class="num" style="color:#dc2626">$${totalExp.toLocaleString()}</div><div class="label">Spent</div></div>
    <div class="stat-box" style="border-left-color:var(--blue)"><div class="num" style="color:var(--blue)">$${profit.toLocaleString()}</div><div class="label">Remaining</div></div>
    <div class="stat-box" style="border-left-color:var(--gold)"><div class="num" style="color:var(--gold)">${totalRev>0?Math.round((totalExp/totalRev)*100):0}%</div><div class="label">Budget Used</div></div>
  `;

  // Revenue table
  document.getElementById('revenueBody').innerHTML = data.revenue.map((r,i) =>
    `<tr><td>${r.name}</td><td class="text-end fw-bold text-success">$${r.amount.toLocaleString()}</td><td class="text-center no-print"><button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="removeRow('revenue',${i})"><i class="bi bi-x"></i></button></td></tr>`
  ).join('');
  document.getElementById('totalRevenue').textContent = '$' + totalRev.toLocaleString();

  // Expense table
  document.getElementById('expenseBody').innerHTML = data.expenses.map((e,i) =>
    `<tr><td>${e.name}</td><td class="text-end fw-bold text-danger">$${e.amount.toLocaleString()}</td><td class="text-center no-print"><button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="removeRow('expense',${i})"><i class="bi bi-x"></i></button></td></tr>`
  ).join('');
  document.getElementById('totalExpense').textContent = '$' + totalExp.toLocaleString();

  // Bar chart
  const maxVal = Math.max(totalRev, 1);
  document.getElementById('chart').innerHTML = `
    <div class="mb-2"><div class="d-flex justify-content-between mb-1"><small class="fw-bold">Total Budget</small><small class="fw-bold text-success">$${totalRev.toLocaleString()}</small></div><div style="background:#e2e8f0;border-radius:4px;height:24px"><div class="chart-bar" style="width:100%;background:linear-gradient(90deg,#16a34a,#4ade80);height:100%"></div></div></div>
    <div class="mb-2"><div class="d-flex justify-content-between mb-1"><small class="fw-bold">Spent</small><small class="fw-bold text-danger">$${totalExp.toLocaleString()}</small></div><div style="background:#e2e8f0;border-radius:4px;height:24px"><div class="chart-bar" style="width:${(totalExp/maxVal)*100}%;background:linear-gradient(90deg,#dc2626,#f87171);height:100%"></div></div></div>
    <div><div class="d-flex justify-content-between mb-1"><small class="fw-bold">Remaining</small><small class="fw-bold" style="color:var(--blue)">$${profit.toLocaleString()}</small></div><div style="background:#e2e8f0;border-radius:4px;height:24px"><div class="chart-bar" style="width:${(Math.max(profit,0)/maxVal)*100}%;background:linear-gradient(90deg,var(--blue),#60a5fa);height:100%"></div></div></div>
  `;

  // Expense pie (horizontal stacked bar)
  const expColors = ['#dc2626','#f97316','#eab308','#84cc16','#06b6d4','#8b5cf6','#ec4899','#64748b'];
  document.getElementById('expensePie').innerHTML = totalExp > 0 ? `
    <div style="display:flex;height:28px;border-radius:6px;overflow:hidden;margin-bottom:.75rem">${data.expenses.map((e,i)=>`<div style="width:${(e.amount/totalExp)*100}%;background:${expColors[i%expColors.length]}" title="${e.name}: $${e.amount}"></div>`).join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:.4rem">${data.expenses.map((e,i)=>`<span style="font-size:.68rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:10px;border-radius:2px;background:${expColors[i%expColors.length]}"></span>${e.name} (${Math.round((e.amount/totalExp)*100)}%)</span>`).join('')}</div>
  ` : '<p class="text-muted small">No expenses yet</p>';

  // Revenue pie
  const revColors = ['#16a34a','#059669','#0d9488','#0891b2','#2563eb','#7c3aed','#c026d3','#64748b'];
  document.getElementById('revenuePie').innerHTML = totalRev > 0 ? `
    <div style="display:flex;height:28px;border-radius:6px;overflow:hidden;margin-bottom:.75rem">${data.revenue.map((r,i)=>`<div style="width:${(r.amount/totalRev)*100}%;background:${revColors[i%revColors.length]}" title="${r.name}: $${r.amount}"></div>`).join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:.4rem">${data.revenue.map((r,i)=>`<span style="font-size:.68rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:10px;border-radius:2px;background:${revColors[i%revColors.length]}"></span>${r.name} (${Math.round((r.amount/totalRev)*100)}%)</span>`).join('')}</div>
  ` : '<p class="text-muted small">No revenue yet</p>';
}

function addRow(type) {
  const name = prompt(type === 'revenue' ? 'Revenue/Sponsor name:' : 'Expense item:');
  if (!name) return;
  const amount = parseFloat(prompt('Amount ($):'));
  if (isNaN(amount) || amount <= 0) return;
  const data = loadData();
  if (type === 'revenue') data.revenue.push({name, amount});
  else data.expenses.push({name, amount});
  saveData(data);
  render();
}

function removeRow(type, index) {
  if (!confirm('Remove this item?')) return;
  const data = loadData();
  if (type === 'revenue') data.revenue.splice(index, 1);
  else data.expenses.splice(index, 1);
  saveData(data);
  render();
}

render();
</script>
</body>
</html>
