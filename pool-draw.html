<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Freedom Cup 2026 — Official Pool Draw</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#BF0A30;--blue:#002868;--blue-dark:#001a4a;--gold:#FFD700;--navy:#000d1a;--purple:#1a0533;--teal:#0d4f4f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--navy);color:#fff;min-height:100vh;overflow-x:hidden;padding-bottom:1rem;position:relative}
h1,h2,h3,h4,h5,h6{font-family:'Poppins',sans-serif}
.gold{color:var(--gold)}

/* Animated Background */
.bg-animated{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,var(--navy) 0%,#0a0025 25%,var(--blue-dark) 50%,#0d1b3e 75%,var(--navy) 100%);background-size:400% 400%;animation:gradientShift 15s ease infinite}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* Particles */
.particles{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:rgba(255,215,0,.6);border-radius:50%;animation:twinkle var(--dur,4s) ease-in-out infinite var(--delay,0s)}
.particle:nth-child(odd){background:rgba(255,255,255,.5);width:2px;height:2px}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}

/* Content wrapper */
.content-wrap{position:relative;z-index:1}

/* Header */
.draw-header{text-align:center;padding:.75rem .5rem .4rem}
.draw-header h1{font-size:1.3rem;font-weight:900;letter-spacing:-0.5px;text-shadow:0 0 20px rgba(255,215,0,.4),0 0 40px rgba(255,215,0,.2)}
.draw-header .title-shimmer{display:inline-block;background:linear-gradient(90deg,var(--gold),#fff,var(--gold));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:0% center}100%{background-position:200% center}}
.draw-header .trophy-wrap{position:relative;display:inline-block}
.draw-header .trophy-wrap::before,.draw-header .trophy-wrap::after{content:'✦';position:absolute;color:var(--gold);font-size:.6rem;animation:sparkle 2s ease-in-out infinite}
.draw-header .trophy-wrap::before{top:-4px;right:-10px;animation-delay:.5s}
.draw-header .trophy-wrap::after{bottom:0;left:-10px;animation-delay:1s}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0deg)}50%{opacity:1;transform:scale(1.2) rotate(180deg)}}
.draw-header .subtitle{color:rgba(255,255,255,.5);font-size:.7rem;margin-top:.25rem;letter-spacing:2px;text-transform:uppercase}
.flag-stripe{height:3px;background:linear-gradient(90deg,var(--red) 33%,#fff 33% 66%,var(--blue) 66%);border-radius:2px;margin-top:.5rem;box-shadow:0 2px 10px rgba(255,215,0,.2)}

/* Wheel Section */
.wheel-section{display:flex;flex-direction:column;align-items:center;padding:.5rem 0}
.wheel-container{position:relative;width:140px;height:140px}
.wheel-glow{position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,215,0,.3);animation:ringPulse 2s ease-in-out infinite;box-shadow:0 0 20px rgba(255,215,0,.15),inset 0 0 20px rgba(255,215,0,.05)}
@keyframes ringPulse{0%,100%{border-color:rgba(255,215,0,.2);box-shadow:0 0 15px rgba(255,215,0,.1)}50%{border-color:rgba(255,215,0,.6);box-shadow:0 0 30px rgba(255,215,0,.3)}}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;border:4px solid var(--gold);box-shadow:0 0 30px rgba(255,215,0,.3),inset 0 0 25px rgba(0,0,0,.5);overflow:hidden;transition:transform .1s}
.wheel.spinning{animation:spin .4s linear infinite;box-shadow:0 0 50px rgba(255,215,0,.5),0 0 80px rgba(255,215,0,.2),inset 0 0 25px rgba(0,0,0,.5)}
.wheel.stopping{animation:spinSlow 1.5s cubic-bezier(.2,.8,.3,1) forwards;box-shadow:0 0 50px rgba(255,215,0,.5),inset 0 0 25px rgba(0,0,0,.5)}
.wheel-half{position:absolute;width:100%;height:50%}
.wheel-half.top{top:0;background:linear-gradient(180deg,#001a4a,#1a3a6b);border-bottom:2px solid rgba(255,255,255,.15)}
.wheel-half.bottom{bottom:0;background:linear-gradient(0deg,#6b0020,#d4102e)}
.wheel-label{position:absolute;width:100%;text-align:center;font-weight:700;font-size:.65rem;color:rgba(255,255,255,.9);letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.wheel-label.top-label{top:14%}
.wheel-label.bottom-label{bottom:14%}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1a1a2e,#0d0d1a);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:var(--gold);z-index:2;box-shadow:0 0 20px rgba(255,215,0,.3),inset 0 0 10px rgba(0,0,0,.5)}
.wheel-pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid var(--gold);z-index:3;filter:drop-shadow(0 0 8px rgba(255,215,0,.8)) drop-shadow(0 2px 4px rgba(0,0,0,.5))}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(1080deg)}}

/* Result Announcement */
.result-announce{text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center;padding:.2rem .5rem;position:relative}
.result-announce .pool-result{font-size:.85rem;font-weight:700;opacity:0;transform:scale(.5);transition:all .5s cubic-bezier(.34,1.56,.64,1);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.result-announce .pool-result.show{opacity:1;transform:scale(1)}
.result-announce .pool-result.show::before{content:'';position:absolute;inset:-10px;background:radial-gradient(ellipse,rgba(255,215,0,.1) 0%,transparent 70%);border-radius:50%;animation:burstGlow .6s ease-out forwards;z-index:-1}
@keyframes burstGlow{0%{transform:scale(0);opacity:1}100%{transform:scale(2);opacity:0}}

/* Draw Button */
.draw-btn{background:linear-gradient(135deg,var(--gold),#f5c518,#ffed4a);color:#1a1a2e;border:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:.85rem;padding:.65rem 1.5rem;border-radius:50px;cursor:pointer;transition:all .3s;box-shadow:0 6px 30px rgba(255,215,0,.35),0 2px 10px rgba(0,0,0,.3);width:100%;max-width:260px;position:relative;overflow:hidden;animation:btnPulse 2s ease-in-out infinite}
.draw-btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:none;animation:btnShine 3s ease-in-out infinite}
@keyframes btnShine{0%,100%{left:-100%}50%{left:120%}}
.draw-btn:hover:not(:disabled){transform:translateY(-2px) scale(1.03);box-shadow:0 8px 40px rgba(255,215,0,.5),0 4px 15px rgba(0,0,0,.3)}
.draw-btn:active:not(:disabled){transform:translateY(1px) scale(.98);box-shadow:0 2px 10px rgba(255,215,0,.3)}
.draw-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;animation:none}
.draw-btn:disabled::after{animation:none}
.draw-btn.complete{background:linear-gradient(135deg,#28a745,#20c997);color:#fff;animation:none}
.draw-btn.complete::after{animation:none}
@keyframes btnPulse{0%,100%{box-shadow:0 6px 30px rgba(255,215,0,.35)}50%{box-shadow:0 6px 50px rgba(255,215,0,.6)}}

.reset-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-size:.72rem;padding:.35rem .9rem;border-radius:20px;cursor:pointer;transition:all .2s;margin-top:.5rem;backdrop-filter:blur(4px)}
.reset-btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.2)}

/* Pool Cards - Glassmorphism */
.pools-row{padding:.75rem .5rem 0}
.pool-card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:.75rem .6rem;min-height:120px;transition:box-shadow .3s}
.pool-card-a{box-shadow:0 0 20px rgba(0,40,104,.3)}
.pool-card-b{box-shadow:0 0 20px rgba(191,10,48,.2)}
.pool-card h5{text-align:center;font-weight:700;font-size:.85rem;padding:.5rem;border-radius:8px;margin-bottom:.6rem;letter-spacing:1px;text-transform:uppercase}
.pool-a-header{background:linear-gradient(135deg,var(--blue),#1a3a6b);border:1px solid rgba(100,181,246,.3);box-shadow:0 0 12px rgba(100,181,246,.2);animation:glowA 3s ease-in-out infinite}
.pool-b-header{background:linear-gradient(135deg,var(--red),#9a0826);border:1px solid rgba(255,100,100,.3);box-shadow:0 0 12px rgba(255,100,100,.2);animation:glowB 3s ease-in-out infinite}
@keyframes glowA{0%,100%{box-shadow:0 0 8px rgba(100,181,246,.2)}50%{box-shadow:0 0 20px rgba(100,181,246,.4)}}
@keyframes glowB{0%,100%{box-shadow:0 0 8px rgba(255,100,100,.2)}50%{box-shadow:0 0 20px rgba(255,100,100,.4)}}
.pool-teams{display:flex;flex-direction:column;gap:.35rem}

/* Team Slots */
.team-slot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--slot-color,rgba(255,255,255,.2));border-radius:8px;padding:.4rem .5rem;display:flex;align-items:center;gap:.4rem;opacity:0;transform:scale(.8);transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.team-slot.placed{opacity:1;transform:scale(1);backdrop-filter:blur(4px)}
.team-slot.placed:hover{box-shadow:0 0 12px rgba(255,215,0,.15);border-color:rgba(255,215,0,.3)}
.team-slot.flash{animation:goldenRipple .9s ease-out;border-color:var(--gold)}
@keyframes goldenRipple{0%{box-shadow:0 0 0 0 rgba(255,215,0,.6),0 0 20px var(--gold)}50%{box-shadow:0 0 0 8px rgba(255,215,0,0),0 0 30px rgba(255,215,0,.3)}100%{box-shadow:0 0 0 0 transparent,0 0 10px rgba(255,215,0,.1)}}
.team-slot .team-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.6rem;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.team-slot .team-name{font-weight:600;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-slot .team-pos{margin-left:auto;font-size:.55rem;color:rgba(255,255,255,.4);font-weight:600;flex-shrink:0;letter-spacing:1px}

/* Remaining Teams - Glassmorphism */
.remaining{padding:.7rem .75rem;margin-top:.75rem;background:rgba(0,10,30,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,.12);border-radius:14px;margin-left:.5rem;margin-right:.5rem}
.remaining h6{color:var(--gold);font-size:.6rem;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:.4rem;text-align:center;text-shadow:0 0 10px rgba(255,215,0,.3)}
.remaining-list{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}
.remaining-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:.22rem .6rem;font-size:.62rem;font-weight:500;transition:all .4s;display:flex;align-items:center;gap:.25rem;animation:chipFloat 3s ease-in-out infinite var(--bob-delay,0s)}
.remaining-chip:nth-child(1){--bob-delay:0s}.remaining-chip:nth-child(2){--bob-delay:.3s}.remaining-chip:nth-child(3){--bob-delay:.6s}.remaining-chip:nth-child(4){--bob-delay:.9s}.remaining-chip:nth-child(5){--bob-delay:1.2s}.remaining-chip:nth-child(6){--bob-delay:1.5s}.remaining-chip:nth-child(7){--bob-delay:1.8s}.remaining-chip:nth-child(8){--bob-delay:2.1s}.remaining-chip:nth-child(9){--bob-delay:2.4s}.remaining-chip:nth-child(10){--bob-delay:2.7s}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.remaining-chip.drawn{opacity:0;transform:translateY(-10px) scale(.3);width:0;padding:0;margin:0;border:0;overflow:hidden}
.remaining-chip .chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 4px currentColor}

/* Confetti Canvas */
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}

/* Complete Overlay */
.draw-complete{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(0,10,30,.95);border:2px solid var(--gold);border-radius:20px;padding:2.5rem 1.5rem;text-align:center;z-index:100;transition:transform .5s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);width:85%;max-width:340px;box-shadow:0 0 60px rgba(255,215,0,.2),0 20px 60px rgba(0,0,0,.5)}
.draw-complete.show{transform:translate(-50%,-50%) scale(1)}
.draw-complete h2{font-size:1.5rem;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.5)}
.draw-complete p{color:rgba(255,255,255,.7);margin-top:.5rem;font-size:.8rem}
.complete-rings{position:absolute;inset:0;border-radius:20px;overflow:hidden;pointer-events:none}
.complete-rings::before,.complete-rings::after{content:'';position:absolute;top:50%;left:50%;width:100px;height:100px;border:2px solid rgba(255,215,0,.3);border-radius:50%;transform:translate(-50%,-50%);animation:ringExpand 2s ease-out infinite}
.complete-rings::after{animation-delay:1s}
@keyframes ringExpand{0%{width:40px;height:40px;opacity:1}100%{width:250px;height:250px;opacity:0}}

/* Tablet+ */
@media(min-width:768px){
.draw-header h1{font-size:1.9rem}
.draw-header .subtitle{font-size:.8rem}
.wheel-container{width:200px;height:200px}
.wheel-center{width:70px;height:70px;font-size:1.1rem}
.team-slot .team-badge{width:32px;height:32px;font-size:.65rem}
.team-slot .team-name{font-size:.75rem}
.pool-card h5{font-size:.9rem}
.pool-card{min-height:150px}
.draw-btn{font-size:1rem;max-width:340px}
.result-announce .pool-result{font-size:1.05rem}
.pools-row{padding:.75rem 1.5rem 0}
.remaining{margin-left:1.5rem;margin-right:1.5rem}
}

/* Desktop */
@media(min-width:1200px){
.draw-header h1{font-size:2.4rem}
.wheel-container{width:250px;height:250px}
.wheel-center{width:88px;height:88px;font-size:1.2rem}
.wheel-label{font-size:.75rem}
.team-slot .team-badge{width:36px;height:36px;font-size:.7rem}
.team-slot .team-name{font-size:.8rem}
.team-slot{padding:.5rem .7rem}
.pool-card{padding:.8rem}
.pool-card h5{font-size:.9rem}
.pools-row{padding:0 3rem}
.remaining{margin-left:3rem;margin-right:3rem}
.draw-btn{max-width:380px;font-size:1.05rem}
}
</style>
</head>
<body>
<div class="bg-animated"></div>
<div class="particles" id="particles"></div>
<div class="content-wrap">

<header class="draw-header">
<h1><span class="trophy-wrap"><i class="bi bi-trophy-fill gold"></i></span> <span class="title-shimmer">Freedom Cup 2026</span></h1>
<p class="subtitle">★ Official Pool Draw Ceremony ★ July 4, 2026</p>
<div class="flag-stripe"></div>
</header>

<section class="wheel-section">
<div class="wheel-container">
<div class="wheel-glow"></div>
<div class="wheel-pointer"></div>
<div class="wheel" id="wheel">
<div class="wheel-half top"></div>
<div class="wheel-half bottom"></div>
<span class="wheel-label top-label">POOL A</span>
<span class="wheel-label bottom-label">POOL B</span>
<div class="wheel-center" id="wheelCenter">?</div>
</div>
</div>
<div class="result-announce" id="resultArea"><div class="pool-result" id="poolResult"></div></div>
<button class="draw-btn" id="drawBtn" onclick="drawNext()"><i class="bi bi-shuffle me-2"></i>START DRAW</button>
<button class="reset-btn" id="resetBtn" onclick="resetDraw()" style="display:none"><i class="bi bi-arrow-repeat me-1"></i>Reset Draw</button>
</section>

<div class="pools-row">
<div class="row g-2">
<div class="col-6">
<div class="pool-card pool-card-a">
<h5 class="pool-a-header"><i class="bi bi-shield-fill me-1"></i>POOL A</h5>
<div class="pool-teams" id="poolASlots"></div>
</div>
</div>
<div class="col-6">
<div class="pool-card pool-card-b">
<h5 class="pool-b-header"><i class="bi bi-shield-fill me-1"></i>POOL B</h5>
<div class="pool-teams" id="poolBSlots"></div>
</div>
</div>
</div>
</div>

<div class="remaining">
<h6><i class="bi bi-people-fill me-1"></i>Teams Remaining</h6>
<div class="remaining-list" id="remainingList"></div>
</div>

<canvas id="confetti"></canvas>

<div class="draw-complete" id="drawComplete">
<div class="complete-rings"></div>
<h2>🏆 DRAW COMPLETE!</h2>
<p>All 10 teams have been assigned to their pools.<br>Let the Freedom Cup begin!</p>
<button class="draw-btn" style="margin-top:1rem;font-size:.82rem;padding:.6rem 1.2rem;animation:none;width:auto" onclick="document.getElementById('drawComplete').classList.remove('show')">Close</button>
</div>

</div>
<script>
// Generate CSS particles
(function(){
const container=document.getElementById('particles');
const positions=[[5,10],[15,80],[25,30],[35,60],[45,15],[55,75],[65,40],[75,90],[85,20],[90,55],[10,45],[30,85],[50,50],[70,10],[80,65],[20,95],[60,5],[40,70],[95,35],[8,60]];
positions.forEach(function(p,i){
const dot=document.createElement('div');
dot.className='particle';
dot.style.left=p[0]+'%';
dot.style.top=p[1]+'%';
dot.style.setProperty('--dur',(3+Math.random()*4)+'s');
dot.style.setProperty('--delay',(Math.random()*5)+'s');
container.appendChild(dot);
});
})();

const teams=[
{name:'Punjab Tigers Albany',short:'PT',color:'#ff8c00'},
{name:'Afghan 11',short:'A11',color:'#1e8449'},
{name:'Zalmi SuperStrikers',short:'Z',color:'#5b2c6f'},
{name:'Hamden Qalandars Green',short:'HQ',color:'#27ae60'},
{name:'Young Fighters',short:'YF',color:'#e74c3c'},
{name:'Rangbaaz',short:'R',color:'#c0392b'},
{name:'MSC',short:'M',color:'#2980b9'},
{name:'WMCC',short:'W',color:'#8e44ad'},
{name:'Hamden Qalandars Blue',short:'HQ',color:'#2471a3'},
{name:'Monroe Hawks',short:'MH',color:'#d35400'}
];

let poolA=[],poolB=[],drawOrder=[],drawIndex=0,isAnimating=false,audioCtx=null;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function initDraw(){
let indices=[...Array(10).keys()];
let valid=false,assignment;
while(!valid){
shuffle(indices);
let a=indices.slice(0,5),b=indices.slice(5);
let greenInA=a.includes(3),blueInA=a.includes(8);
if(greenInA!==blueInA){valid=true;assignment={a,b};}
}
poolA=assignment.a;poolB=assignment.b;
drawOrder=shuffle([...Array(10).keys()]);
drawIndex=0;
renderRemaining();
renderSlots();
}

function renderRemaining(){
const el=document.getElementById('remainingList');
el.innerHTML=teams.map((t,i)=>`<div class="remaining-chip" id="chip${i}"><span class="chip-dot" style="background:${t.color}"></span>${t.name}</div>`).join('');
}

function renderSlots(){
document.getElementById('poolASlots').innerHTML='';
document.getElementById('poolBSlots').innerHTML='';
}

function getPool(teamIdx){return poolA.includes(teamIdx)?'A':'B';}

function drawNext(){
if(isAnimating||drawIndex>=10)return;
isAnimating=true;
const btn=document.getElementById('drawBtn');
btn.disabled=true;
const teamIdx=drawOrder[drawIndex];
const team=teams[teamIdx];
const pool=getPool(teamIdx);

document.getElementById('wheelCenter').textContent=team.short;
document.getElementById('poolResult').classList.remove('show');

const wheel=document.getElementById('wheel');
wheel.classList.add('spinning');
playDrumroll();

setTimeout(()=>{
wheel.classList.remove('spinning');
wheel.classList.add('stopping');
setTimeout(()=>{
wheel.classList.remove('stopping');
stopSound();
revealTeam(teamIdx,team,pool);
},1500);
},1500);
}

function revealTeam(teamIdx,team,pool){
const resultEl=document.getElementById('poolResult');
resultEl.innerHTML=`<span style="color:${pool==='A'?'#64b5f6':'#ef5350'}">${team.name}</span> → <span class="gold">POOL ${pool}</span>`;
resultEl.classList.add('show');

const container=document.getElementById(pool==='A'?'poolASlots':'poolBSlots');
const count=container.children.length;
const card=document.createElement('div');
card.className='team-slot';
card.style.setProperty('--slot-color',team.color);
card.innerHTML=`<div class="team-badge" style="background:${team.color}">${team.short}</div><span class="team-name">${team.name}</span><span class="team-pos">${pool}${count+1}</span>`;
container.appendChild(card);

setTimeout(()=>{card.classList.add('placed');},50);
setTimeout(()=>{card.classList.add('flash');},300);
setTimeout(()=>{card.classList.remove('flash');},1200);

const chip=document.getElementById('chip'+teamIdx);
if(chip)chip.classList.add('drawn');

drawIndex++;
const btn=document.getElementById('drawBtn');

if(drawIndex>=10){
btn.textContent='✓ DRAW COMPLETE';
btn.classList.add('complete');
btn.disabled=true;
document.getElementById('resetBtn').style.display='';
setTimeout(()=>{
document.getElementById('drawComplete').classList.add('show');
launchConfetti();
},800);
}else{
setTimeout(()=>{
btn.disabled=false;
btn.innerHTML='<i class="bi bi-shuffle me-2"></i>DRAW NEXT TEAM';
isAnimating=false;
},600);
}
}

function resetDraw(){
document.getElementById('drawComplete').classList.remove('show');
document.getElementById('drawBtn').disabled=false;
document.getElementById('drawBtn').innerHTML='<i class="bi bi-shuffle me-2"></i>START DRAW';
document.getElementById('drawBtn').classList.remove('complete');
document.getElementById('resetBtn').style.display='none';
document.getElementById('wheelCenter').textContent='?';
document.getElementById('poolResult').classList.remove('show');
isAnimating=false;
initDraw();
}

function playDrumroll(){
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='triangle';osc.frequency.value=80;
const lfo=audioCtx.createOscillator();lfo.frequency.value=20;
const lfoGain=audioCtx.createGain();lfoGain.gain.value=30;
lfo.connect(lfoGain);lfoGain.connect(osc.frequency);
osc.connect(gain);gain.connect(audioCtx.destination);
gain.gain.value=0.15;
lfo.start();osc.start();
audioCtx._osc=osc;audioCtx._lfo=lfo;audioCtx._gain=gain;
}catch(e){}
}
function stopSound(){
try{
if(audioCtx){
audioCtx._gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
setTimeout(()=>{audioCtx._osc.stop();audioCtx._lfo.stop();audioCtx.close();audioCtx=null;},400);
}
}catch(e){}
}

function launchConfetti(){
const canvas=document.getElementById('confetti');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
const pieces=[];
const colors=['#FFD700','#BF0A30','#002868','#fff','#ff6b6b','#64b5f6','#69f0ae'];
for(let i=0;i<200;i++){
pieces.push({x:canvas.width/2,y:canvas.height/2,vx:(Math.random()-0.5)*20,vy:Math.random()*-18-5,w:Math.random()*10+5,h:Math.random()*6+3,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,rv:(Math.random()-0.5)*10,gravity:0.4});
}
let frame=0;
function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
let alive=false;
pieces.forEach(p=>{
p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.rot+=p.rv;p.vx*=0.99;
if(p.y<canvas.height+50)alive=true;
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
});
frame++;
if(alive&&frame<180)requestAnimationFrame(animate);
else ctx.clearRect(0,0,canvas.width,canvas.height);
}
animate();
}

initDraw();
</script>
